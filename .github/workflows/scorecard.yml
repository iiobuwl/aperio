# OpenSSF Scorecard: リポジトリの、サプライチェーンの安全性(ブランチ保護・依存の固定・ワークフローの権限など)を採点します。
# 公開リポジトリで動きます。結果は Security タブに出ます。
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main, master]
  schedule:
    - cron: '41 5 * * 2' # 毎週火曜

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # 結果を Security タブに出す
      id-token: write # 結果の公開(OIDC)に必要
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
